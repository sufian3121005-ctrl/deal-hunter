<!DOCTYPE html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Deal Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857'},ink:{950:'#05070d',900:'#0a0e1a',850:'#0d1220',800:'#111827',700:'#1c2333'}},fontFamily:{sans:['"Noto Sans Thai"','system-ui']},boxShadow:{glow:'0 0 40px -10px rgba(16,185,129,.35)',card:'0 8px 30px -12px rgba(0,0,0,.35)'}}}}</script>
<style>
*{-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 600px at 15% -10%,rgba(16,185,129,.08),transparent),radial-gradient(1000px 500px at 100% 0%,rgba(56,189,248,.08),transparent),#f1f5f9}
.glass{background:rgba(255,255,255,.75);backdrop-filter:blur(16px);border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 16px rgba(0,0,0,.06)}
.pagefade{animation:fadein .28s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tapscale:active{transform:scale(.96)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
input,select,textarea{outline:none}
.ring-grad{background:conic-gradient(var(--c,#10b981) calc(var(--p,0)*1%),rgba(148,163,184,.15) 0)}
.seg{transition:all .18s ease}
.chip{transition:all .15s ease}
</style>
</head>
<body class="text-slate-800 dark:text-slate-100 font-sans min-h-dvh pb-28">

<!-- TOP BAR -->
<header class="sticky top-0 z-40 px-3 pt-3">
 <div class="mx-auto flex max-w-6xl items-center gap-2 rounded-2xl glass px-3 py-2.5">
  <a href="#" onclick="go('/')" class="flex items-center gap-2 shrink-0">
   <span class="grid h-8 w-8 place-items-center rounded-xl bg-gradient-to-br from-brand-400 to-teal-500 text-white shadow-glow">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
   </span>
   <span class="hidden sm:block font-bold tracking-tight text-slate-800">Deal Hunter</span>
  </a>
  <div class="ml-auto flex items-center gap-1.5">
   <span id="quota" class="hidden sm:flex items-center gap-1 rounded-full bg-black/5 px-2.5 py-1 text-[11px] text-slate-500"></span>
   <button onclick="Store.reset()" class="tapscale rounded-full bg-black/5 px-2.5 py-1.5 text-[11px] text-slate-500">รีเซ็ต</button>
  </div>
 </div>
</header>

<div class="mx-auto flex max-w-6xl gap-4 px-3">
 <aside class="hidden md:block w-56 shrink-0 pt-4"><nav class="space-y-1 sticky top-20" id="side"></nav></aside>
 <main class="w-full flex-1 pt-4" id="main"></main>
</div>

<!-- FLOATING BOTTOM NAV -->
<nav class="fixed inset-x-0 bottom-3 z-40 px-3 md:hidden">
 <div class="mx-auto flex max-w-sm items-center justify-between rounded-[26px] glass px-2 py-2 shadow-card" id="bot"></div>
</nav>

<script>
/* ============ i18n / format ============ */
const ic=(n,s='w-5 h-5 inline-block')=>`<i data-lucide="${n}" class="${s}" stroke-width="1.75"></i>`;

const T={status:{analyzing:'กำลังวิเคราะห์',watching:'กำลังติดตาม',negotiating:'กำลังต่อราคา',purchased:'ซื้อแล้ว',listed:'ลงประกาศแล้ว',sold:'ขายแล้ว',passed:'ผ่าน',lost:'พลาดดีล'},
decision:{BUY:'ซื้อได้',NEGOTIATE:'ควรต่อราคา',FIND_BUYER_FIRST:'หาผู้ซื้อก่อน',PASS:'ไม่แนะนำ'},
cond:{new:'ใหม่',like_new:'เหมือนใหม่',good:'ดี',fair:'พอใช้',poor:'ต้องซ่อม',unknown:'ไม่ทราบ'},
buyer:{consumer:'ผู้ใช้ทั่วไป',technician:'ช่างเทคนิค',contractor:'ผู้รับเหมา',dealer:'พ่อค้าคนกลาง',shop:'ร้านค้า',rental_business:'ธุรกิจให้เช่า',reseller:'คนขายต่อ',business_owner:'เจ้าของกิจการ'}};
const money=n=>n==null||isNaN(n)?'—':'฿'+Math.round(n).toLocaleString('th-TH');
const sgn=n=>n==null?'—':(n>=0?'+':'−')+money(Math.abs(n));
const pct=(n,d=1)=>n==null||isNaN(n)?'—':n.toFixed(d)+'%';
const uid=()=>Math.random().toString(36).slice(2,10);

const BAND=s=>s>=90?'excellent':s>=80?'good':s>=65?'negotiate':s>=50?'buyerFirst':'pass';
const BM={excellent:{e:'trending-up',l:'ดีลยอดเยี่ยม',c:'#10b981',tx:'text-emerald-500',bg:'bg-emerald-500/10',ring:'ring-emerald-500/30'},
good:{e:'check-circle-2',l:'ดีลดี',c:'#22c55e',tx:'text-green-500',bg:'bg-green-500/10',ring:'ring-green-500/30'},
negotiate:{e:'minus-circle',l:'ควรต่อราคา',c:'#f59e0b',tx:'text-amber-500',bg:'bg-amber-500/10',ring:'ring-amber-500/30'},
buyerFirst:{e:'users',l:'หาผู้ซื้อก่อน',c:'#38bdf8',tx:'text-sky-500',bg:'bg-sky-500/10',ring:'ring-sky-500/30'},
pass:{e:'x-circle',l:'ไม่แนะนำ',c:'#f43f5e',tx:'text-rose-500',bg:'bg-rose-500/10',ring:'ring-rose-500/30'}};
const bm=s=>BM[BAND(s)];

const CAT={'tools.power':{th:'เครื่องมือช่าง',icon:'wrench',liq:85,fee:5,transport:30,fake:25,repair:35,days:7,decay:1,check:['แปรงถ่าน','เสียงมอเตอร์','สายไฟ/ปลั๊ก','หัวจับดอก']},
'phone':{th:'มือถือ',icon:'smartphone',liq:90,fee:6,transport:10,fake:45,repair:50,days:5,decay:2.5,check:['IMEI/สถานะล็อก','สุขภาพแบต','จอมีเงา/เส้น','กล้องทุกตัว']},
'appliance':{th:'เครื่องใช้ไฟฟ้า',icon:'plug',liq:70,fee:5,transport:55,fake:20,repair:45,days:12,decay:1.5,check:['เปิดติดจริง','เสียงผิดปกติ','อะไหล่หาได้ไหม']},
'generator':{th:'เครื่องยนต์/ปั่นไฟ',icon:'zap',liq:55,fee:5,transport:80,fake:20,repair:60,days:21,decay:1,check:['สตาร์ทติด','ควันสี','ชั่วโมงใช้งาน','น้ำมันรั่ว']},
'bike':{th:'จักรยาน',icon:'bike',liq:45,fee:5,transport:65,fake:30,repair:40,days:25,decay:0.5,check:['เฟรมร้าว','ชุดขับเคลื่อน','เลขเฟรม']},
'furniture':{th:'เฟอร์นิเจอร์',icon:'sofa',liq:40,fee:4,transport:90,fake:10,repair:30,days:30,decay:0.3,check:['ปลวก/เชื้อรา','โครงสร้าง','ขนย้ายเข้าประตูได้ไหม']},
'generic':{th:'ทั่วไป',icon:'package',liq:50,fee:5,transport:50,fake:25,repair:40,days:18,decay:1.2,check:['สภาพโดยรวม','ครบชุดไหม','ทดสอบใช้งานได้']}};

const CATALOG=[
{kw:['makita','hr2470','สว่านโรตารี'],name:'Makita HR2470 สว่านโรตารี่ 24mm',brand:'Makita',model:'HR2470',cat:'tools.power',sold:[5800,6200,6500,7200,6800],list:[5500,7900,8900],conf:88},
{kw:['makita','ddf484'],name:'Makita DDF484 สว่านไร้สาย',brand:'Makita',model:'DDF484',cat:'tools.power',sold:[4600,5000,5400],list:[4300,5800],conf:82},
{kw:['iphone 13 pro','iphone13pro'],name:'iPhone 13 Pro 256GB',brand:'Apple',model:'13 Pro 256GB',cat:'phone',sold:[17500,18200,19000,18800],list:[16900,21000,22500],conf:92},
{kw:['honda','eu22','เครื่องปั่นไฟ'],name:'Honda EU22i เครื่องปั่นไฟ',brand:'Honda',model:'EU22i',cat:'generator',sold:[38000,42000],list:[36000,45000,48000],conf:80},
{kw:['dyson','v11'],name:'Dyson V11 เครื่องดูดฝุ่นไร้สาย',brand:'Dyson',model:'V11',cat:'appliance',sold:[8900,9800,10200],list:[8500,12000],conf:85},
{kw:['trek','จักรยาน','bike'],name:'จักรยานเสือหมอบ Trek',brand:'Trek',model:'—',cat:'bike',sold:[9200],list:[8900,11000,12500],conf:58}];
const findCat=q=>CATALOG.find(c=>c.kw.some(k=>q.toLowerCase().includes(k)))||null;

/* ============ Engine ============ */
const Engine={
 evidence(list){const sold=list.filter(e=>e.type==='sold'&&e.use).map(e=>+e.price).sort((a,b)=>a-b);
  const lst=list.filter(e=>e.type==='listing'&&e.use).map(e=>+e.price).sort((a,b)=>a-b);
  const est=list.filter(e=>e.type==='estimate'&&e.use).map(e=>+e.price).sort((a,b)=>a-b);
  let tier='none',conf=0,base=sold.length?sold:(lst.length?lst:est);
  if(sold.length>=5){tier='sold';conf=90}else if(sold.length>=3){tier='sold';conf=78}
  else if(sold.length>=1){tier='sold';conf=62}else if(lst.length>=2){tier='listing';conf=52}
  else if(est.length){tier='ai_only';conf=42}
  if(tier==='listing')base=lst.map(p=>p*0.88);
  if(!base.length)return{tier:'none',conf:0,low:null,mid:null,high:null,soldN:0,listN:lst.length};
  const s=[...base].sort((a,b)=>a-b),q=f=>s[Math.min(s.length-1,Math.floor(f*(s.length-1)))];
  return{tier,conf,low:q(0),mid:s.length>2?q(.5):(s[0]+s[s.length-1])/2,high:q(1),soldN:sold.length,listN:lst.length};},
 valuation(ev,cond){const adj={new:1.15,like_new:1.08,good:1,fair:.85,poor:.6,unknown:.9}[cond]||1;
  if(ev.mid==null)return{};const mid=ev.mid*adj;
  return{low:ev.low*adj,mid,high:ev.high*adj,fairBuy:mid*.5,maxBuy:mid*.65,target:mid*.92};},
 cost(d){const c=CAT[d.cat]||CAT.generic;
  const transport=d.transport?+d.transport:Math.round((+d.km||0)*8+(c.transport>60?200:60));
  const fee=Math.round((d.target||0)*c.fee/100);
  const labor=Math.round((+d.hours||0)*(+d.rate||300));
  const t={purchase:+d.price||0,transport,repair:+d.repair||0,cleaning:+d.cleaning||0,fee,pack:+d.pack||(c.transport>60?200:80),other:+d.other||0,labor};
  t.total=t.purchase+t.transport+t.repair+t.cleaning+t.fee+t.pack+t.other+t.labor;return t;},
 score(x){const c=CAT[x.cat]||CAT.generic;const roi=x.cost.total>0?(x.profit/x.cost.total)*100:0;const f={};
  f['กำไรที่เป็นไปได้']=Math.max(0,Math.min(100,roi*1.8));
  f['ส่วนลดจากราคาตลาด']=x.mid?Math.max(0,Math.min(100,(1-x.price/x.mid)*180)):0;
  f['ความต้องการตลาด']=c.liq;f['ความเร็วในการขาย']=Math.max(0,100-c.days*3);
  f['ความเสี่ยง (กลับด้าน)']=100-x.risk;
  f['ผลกระทบค่าขนส่ง']=x.cost.total>0?Math.max(0,100-(x.cost.transport/x.cost.total)*400):50;
  f['สภาพสินค้า']={new:100,like_new:92,good:78,fair:60,poor:35,unknown:50}[x.cond]||50;
  f['ความมั่นใจราคา']=x.conf;
  const W={'กำไรที่เป็นไปได้':.25,'ส่วนลดจากราคาตลาด':.15,'ความต้องการตลาด':.15,'ความเร็วในการขาย':.10,'ความเสี่ยง (กลับด้าน)':.15,'ผลกระทบค่าขนส่ง':.05,'สภาพสินค้า':.05,'ความมั่นใจราคา':.10};
  let s=Object.keys(W).reduce((a,k)=>a+f[k]*W[k],0);const caps=[];
  if(x.conf<40){s=Math.min(s,64);caps.push('ความมั่นใจราคาต่ำกว่า 40% → จำกัดคะแนนไว้ที่ 64')}
  if(x.tier==='listing'){s=Math.min(s,79);caps.push('มีแต่ราคาประกาศ ไม่มีราคาขายจริง → จำกัดที่ 79')}
  if(x.tier==='ai_only'){s=Math.min(s,64);caps.push('ไม่มีหลักฐานราคาจากตลาดจริง → จำกัดที่ 64')}
  if(x.soldN<3&&x.soldN>0){s-=8;caps.push('ข้อมูลขายจริงน้อยกว่า 3 จุด → หัก 8 คะแนน')}
  if(x.profit<=0){s=Math.min(s,35);caps.push('กำไรประมาณการติดลบ → จำกัดที่ 35')}
  return{score:Math.max(0,Math.round(s)),factors:f,caps,roi};},
 risk(x){const c=CAT[x.cat]||CAT.generic;let r=(100-c.liq)*.3+c.fake*.25+c.repair*.2+(100-x.conf)*.25;
  if(x.price>30000)r+=8;if(x.cond==='poor')r+=10;if(x.cond==='unknown')r+=6;
  return Math.max(0,Math.min(100,Math.round(r)));},
 decide(s,x){let d=s>=80?'BUY':s>=65?'NEGOTIATE':s>=50?'FIND_BUYER_FIRST':'PASS';const why=[];const c=CAT[x.cat]||CAT.generic;
  if(x.mid)why.push(`ราคาเจ้าของ ${money(x.price)} เทียบราคาตลาดกลาง ${money(x.mid)} = ${x.price<x.mid?'ต่ำกว่า '+pct((1-x.price/x.mid)*100,0):'สูงกว่าตลาด'}`);
  why.push(x.soldN>0?`อ้างอิงราคาขายจริง ${x.soldN} จุด${x.listN?' + ราคาประกาศ '+x.listN+' จุด':''} → ความมั่นใจ ${x.conf}%`:`⚠️ ไม่มีข้อมูลราคาขายจริง → ความมั่นใจเพียง ${x.conf}%`);
  why.push(`หมวด${c.th}: ความต้องการ ${c.liq}/100 · ขายเฉลี่ย ~${c.days} วัน`);
  why.push(`ต้นทุนรวม ${money(x.cost.total)} (ขนส่ง ${money(x.cost.transport)} · ค่าแรง ${money(x.cost.labor)}) → กำไร ${sgn(x.profit)} · ROI ${pct(x.roi)}`);
  why.push(`ความเสี่ยง ${x.risk}/100 · ${x.risk>60?'สูง ควรตรวจสอบละเอียด':x.risk>35?'ปานกลาง':'ต่ำ'}`);
  if(x.price>=30000&&c.liq<75&&d==='BUY'){d='FIND_BUYER_FIRST';why.push('🔵 ราคาสูงเกิน ฿30,000 + สภาพคล่องไม่สูง → บังคับหาผู้ซื้อก่อน')}
  if(x.risk>=70&&d==='BUY'){d='NEGOTIATE';why.push('⚠️ ความเสี่ยงสูง → ลดระดับเป็นควรต่อราคา')}
  if(x.roi<20&&d==='BUY'){d='NEGOTIATE';why.push('ROI ต่ำกว่า 20% → ควรต่อรองราคาเพิ่ม')}
  if(x.profit<=0){d='PASS';why.push('🔴 กำไรติดลบหลังหักต้นทุนทั้งหมด')}
  return{decision:d,why};}};

const Learn={
 history(){return Store.all().filter(d=>d.actualProfit!=null)},
 similar(brand,model){const h=this.history();
  return{exact:h.filter(d=>d.brand&&brand&&d.brand.toLowerCase().trim()===brand.toLowerCase().trim()
   &&d.model&&model&&d.model.toLowerCase().trim()===model.toLowerCase().trim())};},
 blendedPrice(aiMid,sim){if(!sim.exact.length)return{mid:aiMid,source:'ai',n:0};
  const avgSell=sim.exact.reduce((a,d)=>a+d.actualSell,0)/sim.exact.length;
  if(!aiMid)return{mid:avgSell,source:'history',n:sim.exact.length,avgSell};
  const w=Math.min(.85,.3+sim.exact.length*.15);
  return{mid:aiMid*(1-w)+avgSell*w,source:'blended',n:sim.exact.length,avgSell};},
 skillMap(){const h=this.history();const g={};
  h.forEach(d=>{g[d.cat]=g[d.cat]||{n:0,wins:0,profit:0,cost:0,days:0};const x=g[d.cat];
   x.n++;if(d.actualProfit>0)x.wins++;x.profit+=d.actualProfit;x.cost+=(d.actualCost||d.cost.total)||1;x.days+=(d.actualDays||CAT[d.cat].days);});
  return Object.entries(g).map(([cat,x])=>{const roi=x.profit/x.cost*100;const avgDays=x.days/x.n||1;
   return{cat,name:CAT[cat].th,n:x.n,winRate:x.wins/x.n*100,roi,avgDays,ann:roi*(365/avgDays),avgCost:x.cost/x.n};})
   .sort((a,b)=>b.ann-a.ann);},
 negativePatterns(){const h=this.history().filter(d=>d.actualProfit<0);const g={};
  h.forEach(d=>{const far=d.km>20;const key=d.cat+(far?'|far':'');
   g[key]=g[key]||{cat:d.cat,n:0,note:far?'ค่าขนส่งไกลกินกำไรจนขาดทุน':'ขาดทุนซ้ำในหมวดนี้'};g[key].n++});
  return Object.values(g);},
 decayInfo(d){if(['sold','passed','lost'].includes(d.status))return null;
  const days=(Date.now()-d.createdAt)/86400000;const rate=(CAT[d.cat]?.decay||1.2)/7;
  const lost=Math.min(40,days*rate);return{days:Math.floor(days),lostPct:lost,currentValue:d.target*(1-lost/100)};}};

const Cash={get(){const capital=Store.d.settings.capital||0;
  const locked=Store.all().filter(d=>['purchased','listed'].includes(d.status)).reduce((a,d)=>a+(d.actualCost||d.cost.total),0);
  return{capital,locked,available:capital-locked,lockedPct:capital?locked/capital*100:0};}};

const AI={
 parseEvidence(text){if(!text||!text.trim())return[];
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
   const m=l.match(/([\d,]{3,})/g);if(!m)return null;
   const price=+m.map(x=>+x.replace(/,/g,'')).filter(x=>x>=100).sort((a,b)=>b-a)[0];if(!price)return null;
   const sold=/ขายแล้ว|ปิดการขาย|sold|ขายไปแล้ว|จบ/i.test(l);
   return{id:uid(),price,type:sold?'sold':'listing',note:l.slice(0,60),use:true};}).filter(Boolean);},
 identify(inp){const hit=findCat(`${inp.name} ${inp.brand} ${inp.model}`);
  if(hit)return{name:hit.name,brand:hit.brand,model:hit.model,cat:hit.cat,conf:hit.conf,seed:hit};
  return{name:inp.name||'สินค้าไม่ระบุ',brand:inp.brand||'ไม่ทราบ',model:inp.model||'ไม่ทราบ',cat:'generic',conf:inp.name?45:25,seed:null};},
 market(id,pasted){if(pasted.length)return pasted;
  if(id.seed)return id.seed.sold.map(p=>({id:uid(),price:p,type:'estimate',note:'ความจำ AI',use:true}))
   .concat(id.seed.list.map(p=>({id:uid(),price:p,type:'estimate',note:'ความจำ AI',use:true})));
  return[];},
 buyers(cat,price){const map={'tools.power':['technician','contractor','shop'],'phone':['consumer','reseller','shop'],
  'generator':['contractor','rental_business','business_owner'],'appliance':['consumer','reseller'],
  'bike':['consumer','reseller'],'furniture':['consumer','business_owner'],'generic':['consumer','reseller','dealer']}[cat]||['consumer'];
  const why={technician:['ใช้ทำงานประจำวัน ต้องการของพร้อมใช้ทันที',['กลุ่ม FB ช่างไทย','ร้านซ่อมเครื่องมือ']],
  contractor:['ซื้อเพิ่มให้ทีมงาน',['ร้านวัสดุก่อสร้าง','กลุ่มผู้รับเหมา']],shop:['รับไปขายต่อหน้าร้าน',['ร้านมือสองในพื้นที่']],

function Insights(){const d=Learn.history();const skill=Learn.skillMap(),neg=Learn.negativePatterns();
 const purchased=Store.all().filter(x=>['purchased','listed','sold'].includes(x.status)).length;
 const totalAnalyzed=Math.max(purchased,Store.d.stats.totalAnalyzed);const hitRate=totalAnalyzed?purchased/totalAnalyzed*100:0;
 if(!d.length)return`<div class="pagefade"><h1 class="mb-3 text-2xl font-extrabold">สถิติ AI</h1>${Card(EmptyState('📊','ยังไม่มีข้อมูล','บันทึกผลลัพธ์จริงของดีลที่ขายแล้ว เพื่อให้ระบบเรียนรู้'))}</div>`;
 const pe=d.reduce((a,x)=>a+(x.target-x.actualSell)/x.actualSell*100,0)/d.length;
 const win=d.filter(x=>x.actualProfit>0).length/d.length*100;
 const ad=d.reduce((a,x)=>a+(x.actualDays||0),0)/d.length;
 const bands=[[80,100,'80–100'],[65,79,'65–79'],[50,64,'50–64'],[0,49,'0–49']].map(([a,b,l])=>{
 const g=d.filter(x=>x.score>=a&&x.score<=b);return{l,n:g.length,win:g.length?g.filter(x=>x.actualProfit>0).length/g.length*100:null};});
 return`<div class="pagefade space-y-4"><h1 class="text-2xl font-extrabold tracking-tight">สถิติ AI <span class="text-sm font-normal text-slate-500">(${d.length} ดีลปิดแล้ว)</span></h1>
 <div class="grid grid-cols-2 gap-2.5 lg:grid-cols-4">${Stat('🎯','AI ประเมินราคาคลาด',pct(pe),Math.abs(pe)<10?'text-emerald-400':'text-amber-400')}
 ${Stat('✅','อัตราทำกำไร',pct(win,0),win>=70?'text-emerald-400':'text-amber-400')}${Stat('⏱️','เวลาขายเฉลี่ย',ad.toFixed(1)+' วัน')}
 ${Stat('🎯','Hit Rate',pct(hitRate,0),'text-brand-500')}</div>
 <div class="grid gap-3 lg:grid-cols-2">
 ${Card(`${Section('คะแนน เทียบ ผลจริง')}<table class="w-full text-left text-[13px]"><thead class="text-slate-500 text-xs"><tr><th class="pb-1.5">ช่วง</th><th>ดีล</th><th>ทำกำไร</th></tr></thead>
 <tbody>${bands.map(b=>`<tr class="border-t border-black/5 dark:border-white/5"><td class="py-2">${b.l}</td><td>${b.n}</td><td class="${b.win>=70?'text-emerald-400':b.win!=null?'text-amber-400':''}">${b.win==null?'—':pct(b.win,0)}</td></tr>`).join('')}</tbody></table>`)}
 ${Card(`${Section('🏆 แผนที่ความถนัด')}<table class="w-full text-left text-[13px]"><thead class="text-slate-500 text-xs"><tr><th class="pb-1.5">หมวด</th><th>ดีล</th><th>Win</th><th>ROI/ปี</th></tr></thead>
 <tbody>${skill.map(s=>`<tr class="border-t border-black/5 dark:border-white/5"><td class="py-2">${CAT[s.cat].icon} ${s.name}</td><td>${s.n}</td><td class="${s.winRate>=70?'text-emerald-400':'text-amber-400'}">${pct(s.winRate,0)}</td><td class="font-bold">${pct(s.ann,0)}</td></tr>`).join('')}</tbody></table>`)}</div>
 ${Card(`${Section('🚫 แพทเทิร์นที่เคยขาดทุน')}${neg.length?neg.map(p=>`<div class="mb-1 text-[13px] text-rose-400">• ${CAT[p.cat].th}: ${p.note} (${p.n} ครั้ง)</div>`).join(''):'<div class="text-[13px] text-slate-500">ยังไม่พบแพทเทิร์นซ้ำ</div>'}`)}
 ${Card(`${Section('💡 บทเรียนจากดีลจริง')}<div class="space-y-1 text-[13px] text-slate-500">${d.filter(x=>x.lesson).map(x=>`<div>• ${x.lesson}</div>`).join('')||'ยังไม่มีบันทึก'}</div>`)}</div>`;}

/* ============ actions ============ */
function setCond(c){cond=c;document.querySelectorAll('.cbtn').forEach(b=>{const on=b.dataset.c===c;
 b.className=`cbtn chip rounded-full px-3.5 py-1.5 text-xs font-medium ${on?'bg-brand-500 text-white':'bg-black/5 text-slate-500 dark:bg-white/5'}`});}
async function upload(el){[...el.files].slice(0,1).forEach(f=>{const r=new FileReader();r.onload=e=>{
 const i=new Image();i.onload=async()=>{const c=document.createElement('canvas');const s=Math.min(1,600/i.width);
 c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
 const b64 = c.toDataURL('image/jpeg',.7); imgs=[b64];
 document.getElementById('drop').innerHTML=`<img src="${b64}" class="h-20 rounded-xl"> <span class="text-xs ml-2 text-brand-500 font-bold animate-pulse">กำลังวิเคราะห์ด้วย AI...</span>`;
 await analyzeWithGemini(b64);};i.src=e.target.result};r.readAsDataURL(f)});}
async function analyzeWithGemini(b64){
 const key = localStorage.getItem('gemini_api_key');
 if(!key) {
  const k = prompt('1. กรุณาใส่ Gemini API Key (ดึงได้จาก Google AI Studio):');
  if(k){ localStorage.setItem('gemini_api_key', k); analyzeWithGemini(b64); }
  else { document.getElementById('drop').innerHTML=`<img src="${b64}" class="absolute inset-0 h-full w-full object-cover">`; }
  return;
 }
 try{
  const b64data = b64.split(',')[1];
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+key, {
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({contents:[{parts:[
    {text:"You are an expert second-hand appraiser. Analyze image. Reply JSON only: 'name' (Thai), 'brand', 'model', 'condition' ('new','like_new','good','fair','poor'), 'est_market_price_thb' (number)."},
    {inlineData:{mimeType:"image/jpeg", data:b64data}}
   ]}]})
  });
  const d = await res.json();
  if(d.error) throw new Error(d.error.message);
  const text = d.candidates[0].content.parts[0].text.replace(/```json/g,'').replace(/```/g,'').trim();
  const obj = JSON.parse(text);
  
  if(document.getElementById('f_name')) document.getElementById('f_name').value = obj.name || '';
  if(document.getElementById('f_brand')) document.getElementById('f_brand').value = obj.brand || '';
  if(document.getElementById('f_model')) document.getElementById('f_model').value = obj.model || '';
  if(obj.condition) setCond(obj.condition);

  document.getElementById('drop').innerHTML=`<img src="${b64}" class="absolute inset-0 h-full w-full object-cover opacity-50"><div class="relative z-10 font-bold text-white text-lg animate-pulse bg-black/40 px-4 py-2 rounded-full">ดึงราคาตลาดจริง...</div>`;

  let marketDataStr = `ราคาประเมินโดย AI (อ้างอิง) ${obj.est_market_price_thb||0} บาท\n`;
  const serperKey = localStorage.getItem('serper_api_key');
  if(!serperKey && !localStorage.getItem('serper_skipped')) {
     const sk = prompt('2. (ทางเลือก) ใส่ Serper.dev API Key เพื่อสแกนดึงราคาจาก Shopee/eBay จริงๆ\n(ถ้าไม่มีให้กด Cancel เพื่อใช้ราคาประเมินจาก AI เพียวๆแทนได้ครับ)');
     if(sk) { localStorage.setItem('serper_api_key', sk); }
     else { localStorage.setItem('serper_skipped', '1'); }
  }
  
  if(localStorage.getItem('serper_api_key')) {
      try {
          const sRes = await fetch('https://google.serper.dev/search', {
              method:'POST', headers:{'X-API-KEY':localStorage.getItem('serper_api_key'),'Content-Type':'application/json'},
              body:JSON.stringify({q: `${obj.name} มือสอง site:shopee.co.th OR site:ebay.com OR site:facebook.com`, gl:'th', hl:'th'})
          });
          const sData = await sRes.json();
          if(sData.organic && sData.organic.length) {
              const snippets = sData.organic.map(o => `${o.title} ${o.snippet}`).join('\n');
              marketDataStr += snippets;
          }
      } catch(se) { console.error('Serper error', se); }
  }

  if(document.getElementById('f_ev')) document.getElementById('f_ev').value = marketDataStr;
  parseEv();
  document.getElementById('drop').innerHTML=`<img src="${b64}" class="absolute inset-0 h-full w-full object-cover"><div class="absolute bottom-3 right-3 text-[10px] px-2 py-1 bg-emerald-500 text-white rounded-full font-bold">✓ สแกนสำเร็จ</div>`;
  toast('สแกนเสร็จสิ้น!');

  if(!V('f_price')) {
      setTimeout(()=>{
          const p = prompt(`วิเคราะห์เจอ: ${obj.name}\n\n👉 แม่ค้าขายราคาเท่าไหร่ครับ (บาท)?`);
          if(p && !isNaN(p)) {
              document.getElementById('f_price').value = p;
              analyze();
          }
      }, 300);
  } else {
      analyze();
  }
 }catch(e){
  console.error(e); alert('เกิดข้อผิดพลาด: '+e.message);
  document.getElementById('drop').innerHTML=`<img src="${b64}" class="absolute inset-0 h-full w-full object-cover">`;
  if(e.message.includes('API key')) localStorage.removeItem('gemini_api_key');
 }
}
function parseEv(){pending=AI.parseEvidence(V('f_ev'));rerenderEv();}
function rerenderEv(){document.getElementById('evList').innerHTML=EvList();}

function analyze(){
 const raw={name:V('f_name'),brand:V('f_brand'),model:V('f_model'),price:+V('f_price'),km:+V('f_km')||0,loc:V('f_loc'),
 transport:V('f_transport'),repair:V('f_repair'),cleaning:V('f_clean'),pack:V('f_pack'),other:V('f_other'),
 hours:V('f_hours')||2,rate:V('f_rate')||300,seller:V('f_seller'),sellerPhone:V('f_phone')};
 if(!raw.price)return toast('กรุณากรอกราคาที่เจ้าของขาย');
 const hasReceipt=document.getElementById('chk_receipt')?document.getElementById('chk_receipt').checked:false;
 const id=AI.identify({name:raw.name,brand:raw.brand,model:raw.model});
 const sim=Learn.similar(id.brand,id.model);const usedAI=sim.exact.length<3;Store.trackAI(usedAI);
 const useEv=pending.length?pending:AI.market(id,[]);
 const E=Engine.evidence(useEv);let val=Engine.valuation(E,cond),priceSource=E.tier==='none'?'none':'ai';let waterfall=null;
 if(sim.exact.length){const blend=Learn.blendedPrice(val.mid,sim);const mid=blend.mid;
 val={low:val.low||mid*.85,mid,high:val.high||mid*1.15,fairBuy:mid*.5,maxBuy:mid*.65,target:mid*.92};
 priceSource=blend.source;waterfall={n:sim.exact.length,avgSell:blend.avgSell};}
 const d0={cat:id.cat,price:raw.price,km:raw.km,transport:raw.transport||null,repair:raw.repair,cleaning:raw.cleaning,pack:raw.pack,other:raw.other,hours:raw.hours,rate:raw.rate,target:val.target||0};
 const cost=Engine.cost(d0);const profit=(val.target||0)-cost.total;
 const risk=Engine.risk({cat:id.cat,conf:E.conf,price:raw.price,cond});
 let sc=Engine.score({cat:id.cat,cost,profit,price:raw.price,mid:val.mid,risk,cond,conf:E.conf,tier:E.tier,soldN:E.soldN});
 const skill=Learn.skillMap().find(s=>s.cat===id.cat);let scoreFinal=sc.score;
 let dec=Engine.decide(sc.score,{price:raw.price,mid:val.mid,soldN:E.soldN,listN:E.listN,conf:E.conf,cat:id.cat,cost,profit,roi:sc.roi,risk});
 if(skill&&skill.n>=3){if(skill.winRate<50){scoreFinal=Math.max(0,scoreFinal-12);dec.why.push(`⚠️ หมวดนี้สำเร็จแค่ ${skill.winRate.toFixed(0)}% จาก ${skill.n} ดีล → ลดคะแนน`);}
 else if(skill.winRate>=80){scoreFinal=Math.min(100,scoreFinal+4);dec.why.push(`🏆 หมวดนี้คุณถนัด win rate ${skill.winRate.toFixed(0)}%`);}}
 const negp=Learn.negativePatterns().find(p=>p.cat===id.cat);
 if(negp&&raw.km>20)dec.why.push(`🚫 เคยขาดทุนแพทเทิร์นนี้ ${negp.n} ครั้ง: ${negp.note}`);
 const provenanceFlag=val.mid&&raw.price<val.mid*0.4&&!hasReceipt;
 if(provenanceFlag)sc.caps.push('ราคาต่ำผิดปกติและไม่มีหลักฐานที่มา → จำกัดคำแนะนำ');
 let dec2=Engine.decide(scoreFinal,{price:raw.price,mid:val.mid,soldN:E.soldN,listN:E.listN,conf:E.conf,cat:id.cat,cost,profit,roi:sc.roi,risk});
 if(provenanceFlag&&dec2.decision==='BUY'){dec2.decision='NEGOTIATE';dec2.why.unshift('🚩 ต้องตรวจสอบที่มาก่อน แม้ตัวเลขจะดี');}
 const annualized=sc.roi*(365/CAT[id.cat].days);const cf=Cash.get();const capitalPct=cf.capital?cost.total/cf.capital*100:0;
 ana={...id,idConf:id.conf,cond,price:raw.price,km:raw.km,loc:raw.loc,img:imgs[0]||null,createdAt:Date.now(),status:'watching',
 seller:raw.seller,sellerPhone:raw.sellerPhone,hasReceipt,provenanceFlag,
 low:val.low,mid:val.mid,high:val.high,fairBuy:val.fairBuy,maxBuy:val.maxBuy,target:val.target,
 cost,profit,roi:sc.roi,annualized,capitalPct,score:Math.round(scoreFinal),factors:sc.factors,caps:sc.caps,
 risk,conf:E.conf,tier:E.tier,soldN:E.soldN,listN:E.listN,priceSource,decision:dec2.decision,why:[...dec2.why,...dec.why.slice(4)],buyers:AI.buyers(id.cat,raw.price),waterfall,usedAI};
 const R=document.getElementById('result');
 const steps=['ระบุสินค้า','ตรวจสอบประวัติของคุณ','ประเมินมูลค่า','คำนวณต้นทุน','ตรวจสอบความเสี่ยง/ที่มา','สรุปคำตัดสิน'];let i=0;
 const tick=()=>{if(i<steps.length){R.innerHTML=Card(`<div class="mb-3 text-sm font-bold">กำลังวิเคราะห์...</div>
 ${steps.map((s,j)=>`<div class="mb-2 flex items-center gap-2 text-xs ${j<i?'text-emerald-400':j===i?'font-semibold':'text-slate-500'}"><span>${j<i?'✓':j===i?'⟳':'○'}</span> ${s}</div>`).join('')}`);
 i++;setTimeout(tick,200);}else{R.innerHTML=Result(ana);R.scrollIntoView({behavior:'smooth',block:'start'});}};tick();}

function saveDeal(){if(!ana)return;Store.add({...ana,events:[{t:'found',at:Date.now()}]});ana=null;imgs=[];pending=[];toast('บันทึกดีลแล้ว');go('/deals');}
function addEv(id,t){const amt=['purchased','sold'].includes(t)?+prompt('จำนวนเงิน (฿)')||null:null;
 Store.event(id,t,amt);const map={contacted:'negotiating',purchased:'purchased',listed:'listed',sold:'sold'};if(map[t])Store.upd(id,{status:map[t]});}
function saveResult(id){const s=+V('r_sell'),dy=+V('r_days');if(!s)return toast('กรอกราคาขายจริง');const d=Store.get(id);
 Store.upd(id,{actualSell:s,actualCost:d.cost.total,actualProfit:s-d.cost.total,actualDays:dy||null,lesson:V('r_lesson'),status:'sold'});
 toast('บันทึกแล้ว — ระบบฉลาดขึ้นแล้ว');}

render();

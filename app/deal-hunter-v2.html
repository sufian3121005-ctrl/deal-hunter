<!DOCTYPE html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deal Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857'},ink:{950:'#05070d',900:'#0a0e1a',850:'#0d1220',800:'#111827',700:'#1c2333'}},fontFamily:{sans:['"Noto Sans Thai"','system-ui']},boxShadow:{glow:'0 0 40px -10px rgba(16,185,129,.35)',card:'0 8px 30px -12px rgba(0,0,0,.35)'}}}}</script>
<style>
*{-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 600px at 15% -10%,rgba(16,185,129,.08),transparent),radial-gradient(1000px 500px at 100% 0%,rgba(56,189,248,.08),transparent),#f1f5f9}
.glass{background:rgba(255,255,255,.75);backdrop-filter:blur(16px);border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 16px rgba(0,0,0,.06)}
.pagefade{animation:fadein .28s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tapscale:active{transform:scale(.96)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
input,select,textarea{outline:none}
.ring-grad{background:conic-gradient(var(--c,#10b981) calc(var(--p,0)*1%),rgba(148,163,184,.15) 0)}
.seg{transition:all .18s ease}
.chip{transition:all .15s ease}
</style>
</head>
<body class="text-slate-800 dark:text-slate-100 font-sans min-h-dvh pb-28">

<!-- TOP BAR -->
<header class="sticky top-0 z-40 px-3 pt-3">
 <div class="mx-auto flex max-w-6xl items-center gap-2 rounded-2xl glass px-3 py-2.5">
  <a href="#" onclick="go('/')" class="flex items-center gap-2 shrink-0">
   <span class="grid h-8 w-8 place-items-center rounded-xl bg-gradient-to-br from-brand-400 to-teal-500 text-white shadow-glow">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
   </span>
   <span class="hidden sm:block font-bold tracking-tight text-slate-800">Deal Hunter</span>
  </a>
  <div class="ml-auto flex items-center gap-1.5">
   <span id="quota" class="hidden sm:flex items-center gap-1 rounded-full bg-black/5 px-2.5 py-1 text-[11px] text-slate-500"></span>
   <button onclick="Store.reset()" class="tapscale rounded-full bg-black/5 px-2.5 py-1.5 text-[11px] text-slate-500">รีเซ็ต</button>
  </div>
 </div>
</header>

<div class="mx-auto flex max-w-6xl gap-4 px-3">
 <aside class="hidden md:block w-56 shrink-0 pt-4"><nav class="space-y-1 sticky top-20" id="side"></nav></aside>
 <main class="w-full flex-1 pt-4" id="main"></main>
</div>

<!-- FLOATING BOTTOM NAV -->
<nav class="fixed inset-x-0 bottom-3 z-40 px-3 md:hidden">
 <div class="mx-auto flex max-w-sm items-center justify-between rounded-[26px] glass px-2 py-2 shadow-card" id="bot"></div>
</nav>

<script>
/* ============ i18n / format ============ */
const ic=(n,s='w-5 h-5 inline-block')=>`<i data-lucide="${n}" class="${s}" stroke-width="1.75"></i>`;

const T={status:{analyzing:'กำลังวิเคราะห์',watching:'กำลังติดตาม',negotiating:'กำลังต่อราคา',purchased:'ซื้อแล้ว',listed:'ลงประกาศแล้ว',sold:'ขายแล้ว',passed:'ผ่าน',lost:'พลาดดีล'},
decision:{BUY:'ซื้อได้',NEGOTIATE:'ควรต่อราคา',FIND_BUYER_FIRST:'หาผู้ซื้อก่อน',PASS:'ไม่แนะนำ'},
cond:{new:'ใหม่',like_new:'เหมือนใหม่',good:'ดี',fair:'พอใช้',poor:'ต้องซ่อม',unknown:'ไม่ทราบ'},
buyer:{consumer:'ผู้ใช้ทั่วไป',technician:'ช่างเทคนิค',contractor:'ผู้รับเหมา',dealer:'พ่อค้าคนกลาง',shop:'ร้านค้า',rental_business:'ธุรกิจให้เช่า',reseller:'คนขายต่อ',business_owner:'เจ้าของกิจการ'}};
const money=n=>n==null||isNaN(n)?'—':'฿'+Math.round(n).toLocaleString('th-TH');
const sgn=n=>n==null?'—':(n>=0?'+':'−')+money(Math.abs(n));
const pct=(n,d=1)=>n==null||isNaN(n)?'—':n.toFixed(d)+'%';
const uid=()=>Math.random().toString(36).slice(2,10);

const BAND=s=>s>=90?'excellent':s>=80?'good':s>=65?'negotiate':s>=50?'buyerFirst':'pass';
const BM={excellent:{e:'trending-up',l:'ดีลยอดเยี่ยม',c:'#10b981',tx:'text-emerald-500',bg:'bg-emerald-500/10',ring:'ring-emerald-500/30'},
good:{e:'check-circle-2',l:'ดีลดี',c:'#22c55e',tx:'text-green-500',bg:'bg-green-500/10',ring:'ring-green-500/30'},
negotiate:{e:'minus-circle',l:'ควรต่อราคา',c:'#f59e0b',tx:'text-amber-500',bg:'bg-amber-500/10',ring:'ring-amber-500/30'},
buyerFirst:{e:'users',l:'หาผู้ซื้อก่อน',c:'#38bdf8',tx:'text-sky-500',bg:'bg-sky-500/10',ring:'ring-sky-500/30'},
pass:{e:'x-circle',l:'ไม่แนะนำ',c:'#f43f5e',tx:'text-rose-500',bg:'bg-rose-500/10',ring:'ring-rose-500/30'}};
const bm=s=>BM[BAND(s)];

const CAT={'apparel.football':{th:'เสื้อฟุตบอล',icon:'trophy',hrs:.5,liq:70,fee:5,transport:5,fake:65,repair:10,days:14,decay:.4,check:['รหัสสินค้า','ป้ายคอ','โลโก้/ตราสโมสร','jock tag']},'apparel.denim':{th:'ยีนส์/แจ็คเก็ตวินเทจ',icon:'scissors',hrs:.5,liq:60,fee:5,transport:15,fake:35,repair:15,days:18,decay:.3,check:['แท็บแดง','ป้ายหลังเอว','ป้ายวิธีซัก/รหัสวันที่','ผ้าริม/หมุด']},
'apparel.vintage':{th:'เสื้อวินเทจ',icon:'shirt',hrs:.5,liq:65,fee:5,transport:5,fake:40,repair:10,days:14,decay:0.3,check:['ป้ายคอ','ตะเข็บเดี่ยวปลายแขน/ชาย','ปีลิขสิทธิ์ใต้ลาย','รู/คราบ/ขนาดจริง']},
'shoes.brand':{th:'รองเท้าแบรนด์',icon:'footprints',hrs:.5,liq:75,fee:6,transport:10,fake:70,repair:20,days:10,decay:0.8,check:['ป้ายในลิ้น/รหัสรุ่น','ตะเข็บ/กาว','พื้นสึก','กล่อง']},
'luxury':{th:'กระเป๋า/นาฬิกาแบรนด์เนม',icon:'gem',hrs:.5,liq:60,fee:8,transport:10,fake:90,repair:20,days:20,decay:.5,check:['รหัสผลิต','ฟอนต์/โลโก้','อะไหล่โลหะ','ใบรับประกัน']},
'tools.power':{th:'เครื่องมือช่าง',icon:'wrench',liq:85,fee:5,transport:30,fake:25,repair:35,days:7,decay:1,check:['แปรงถ่าน','เสียงมอเตอร์','สายไฟ/ปลั๊ก','หัวจับดอก']},
'phone':{th:'มือถือ',icon:'smartphone',liq:90,fee:6,transport:10,fake:45,repair:50,days:5,decay:2.5,check:['IMEI/สถานะล็อก','สุขภาพแบต','จอมีเงา/เส้น','กล้องทุกตัว']},
'appliance':{th:'เครื่องใช้ไฟฟ้า',icon:'plug',liq:70,fee:5,transport:55,fake:20,repair:45,days:12,decay:1.5,check:['เปิดติดจริง','เสียงผิดปกติ','อะไหล่หาได้ไหม']},
'generator':{th:'เครื่องยนต์/ปั่นไฟ',icon:'zap',liq:55,fee:5,transport:80,fake:20,repair:60,days:21,decay:1,check:['สตาร์ทติด','ควันสี','ชั่วโมงใช้งาน','น้ำมันรั่ว']},
'bike':{th:'จักรยาน',icon:'bike',liq:45,fee:5,transport:65,fake:30,repair:40,days:25,decay:0.5,check:['เฟรมร้าว','ชุดขับเคลื่อน','เลขเฟรม']},
'furniture':{th:'เฟอร์นิเจอร์',icon:'sofa',liq:40,fee:4,transport:90,fake:10,repair:30,days:30,decay:0.3,check:['ปลวก/เชื้อรา','โครงสร้าง','ขนย้ายเข้าประตูได้ไหม']},
'generic':{th:'ทั่วไป',icon:'package',liq:50,fee:5,transport:50,fake:25,repair:40,days:18,decay:1.2,check:['สภาพโดยรวม','ครบชุดไหม','ทดสอบใช้งานได้']}};

/* ช่องทางขาย: fee = ค่าธรรมเนียมโดยประมาณ (%) ship = ค่าส่ง/แพ็กโดยประมาณ (บาท) mul = ราคาขายเทียบราคาตลาดไทย — ตัวเลขประมาณการ ปรับได้ตามจริง */
const CHANNELS={
 fb:{n:'กลุ่ม Facebook / Marketplace',fee:0,ship:0,mul:1,speed:'เร็ว',tip:'ลงกลุ่มเฉพาะทางของหมวดนี้ นัดรับในพื้นที่'},
 shopee:{n:'Shopee / Lazada',fee:10,ship:40,mul:1.05,speed:'กลาง',tip:'คนค้นเยอะ เหมาะของส่งพัสดุง่าย'},
 live:{n:'TikTok / IG Live',fee:5,ship:40,mul:1.15,speed:'เร็ว (ถ้ามีผู้ติดตาม)',tip:'ขายทีละหลายชิ้น เหมาะเสื้อผ้าวินเทจ'},
 ebay:{n:'eBay (ส่งต่างประเทศ)',fee:15,ship:450,mul:null,speed:'ช้า',tip:'คุ้มเฉพาะของหายากที่ราคา eBay สูงกว่าไทยมาก'},
 shop:{n:'ร้านรับซื้อ / ตลาดนัด',fee:0,ship:0,mul:.6,speed:'ได้เงินทันที',tip:'ใช้เมื่ออยากได้เงินสดเร็ว'}};
const CAT_CH={'apparel.football':['fb','live','shopee','ebay','shop'],'apparel.denim':['live','fb','ebay','shopee','shop'],luxury:['fb','shop'],'apparel.vintage':['live','fb','ebay','shopee','shop'],'shoes.brand':['fb','shopee','live','shop'],'tools.power':['fb','shopee','shop'],'phone':['fb','shopee','shop'],generic:['fb','shopee','shop']};
function sellPlan(cat,mid,ebayMid){if(!mid&&!ebayMid)return[];const keys=CAT_CH[cat]||CAT_CH.generic;
 return keys.map(k=>{const c=CHANNELS[k];let sell=c.mul==null?(ebayMid||0):(mid||0)*c.mul;if(!sell)return null;
  const net=Math.round(sell*(1-c.fee/100)-c.ship);return{k,...c,sell:Math.round(sell),net};}).filter(Boolean).sort((a,b)=>b.net-a.net);}
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;};

const CATALOG=[
{kw:['makita','hr2470','สว่านโรตารี'],name:'Makita HR2470 สว่านโรตารี่ 24mm',brand:'Makita',model:'HR2470',cat:'tools.power',sold:[5800,6200,6500,7200,6800],list:[5500,7900,8900],conf:88},
{kw:['makita','ddf484'],name:'Makita DDF484 สว่านไร้สาย',brand:'Makita',model:'DDF484',cat:'tools.power',sold:[4600,5000,5400],list:[4300,5800],conf:82},
{kw:['iphone 13 pro','iphone13pro'],name:'iPhone 13 Pro 256GB',brand:'Apple',model:'13 Pro 256GB',cat:'phone',sold:[17500,18200,19000,18800],list:[16900,21000,22500],conf:92},
{kw:['honda','eu22','เครื่องปั่นไฟ'],name:'Honda EU22i เครื่องปั่นไฟ',brand:'Honda',model:'EU22i',cat:'generator',sold:[38000,42000],list:[36000,45000,48000],conf:80},
{kw:['dyson','v11'],name:'Dyson V11 เครื่องดูดฝุ่นไร้สาย',brand:'Dyson',model:'V11',cat:'appliance',sold:[8900,9800,10200],list:[8500,12000],conf:85},
{kw:['trek','จักรยาน','bike'],name:'จักรยานเสือหมอบ Trek',brand:'Trek',model:'—',cat:'bike',sold:[9200],list:[8900,11000,12500],conf:58}];
const findCat=q=>CATALOG.find(c=>c.kw.some(k=>q.toLowerCase().includes(k)))||null;

/* ============ Engine ============ */
const Engine={
 evidence(list){const sold=list.filter(e=>e.type==='sold'&&e.use).map(e=>+e.price).sort((a,b)=>a-b);
  const lst=list.filter(e=>e.type==='listing'&&e.use).map(e=>+e.price).sort((a,b)=>a-b);
  const est=list.filter(e=>e.type==='estimate'&&e.use).map(e=>+e.price).sort((a,b)=>a-b);
  let tier='none',conf=0,base=sold.length?sold:(lst.length?lst:est);
  if(sold.length>=5){tier='sold';conf=90}else if(sold.length>=3){tier='sold';conf=78}
  else if(sold.length>=1){tier='sold';conf=62}else if(lst.length>=2){tier='listing';conf=52}
  else if(est.length){tier='ai_only';conf=42}
  if(tier==='listing')base=lst.map(p=>p*0.88);
  if(!base.length)return{tier:'none',conf:0,low:null,mid:null,high:null,soldN:0,listN:lst.length};
  const s=[...base].sort((a,b)=>a-b),q=f=>s[Math.min(s.length-1,Math.floor(f*(s.length-1)))];
  return{tier,conf,low:q(0),mid:s.length>2?q(.5):(s[0]+s[s.length-1])/2,high:q(1),soldN:sold.length,listN:lst.length};},
 valuation(ev,cond){const adj={new:1.15,like_new:1.08,good:1,fair:.85,poor:.6,unknown:.9}[cond]||1;
  if(ev.mid==null)return{};const mid=ev.mid*adj;
  return{low:ev.low*adj,mid,high:ev.high*adj,fairBuy:mid*.5,maxBuy:mid*.65,target:mid*.92};},
 cost(d){const c=CAT[d.cat]||CAT.generic;
  const transport=d.transport?+d.transport:Math.round((+d.km||0)*8+(c.transport>60?200:60));
  const fee=Math.round((d.target||0)*c.fee/100);
  const labor=Math.round((+d.hours||0)*(+d.rate||300));
  const t={purchase:+d.price||0,transport,repair:+d.repair||0,cleaning:+d.cleaning||0,fee,pack:+d.pack||(c.transport>60?200:80),other:+d.other||0,labor};
  t.total=t.purchase+t.transport+t.repair+t.cleaning+t.fee+t.pack+t.other+t.labor;return t;},
 score(x){const c=CAT[x.cat]||CAT.generic;const roi=x.cost.total>0?(x.profit/x.cost.total)*100:0;const f={};
  f['กำไรที่เป็นไปได้']=Math.max(0,Math.min(100,roi*1.8));
  f['ส่วนลดจากราคาตลาด']=x.mid?Math.max(0,Math.min(100,(1-x.price/x.mid)*180)):0;
  f['ความต้องการตลาด']=c.liq;f['ความเร็วในการขาย']=Math.max(0,100-c.days*3);
  f['ความเสี่ยง (กลับด้าน)']=100-x.risk;
  f['ผลกระทบค่าขนส่ง']=x.cost.total>0?Math.max(0,100-(x.cost.transport/x.cost.total)*400):50;
  f['สภาพสินค้า']={new:100,like_new:92,good:78,fair:60,poor:35,unknown:50}[x.cond]||50;
  f['ความมั่นใจราคา']=x.conf;
  const W={'กำไรที่เป็นไปได้':.25,'ส่วนลดจากราคาตลาด':.15,'ความต้องการตลาด':.15,'ความเร็วในการขาย':.10,'ความเสี่ยง (กลับด้าน)':.15,'ผลกระทบค่าขนส่ง':.05,'สภาพสินค้า':.05,'ความมั่นใจราคา':.10};
  let s=Object.keys(W).reduce((a,k)=>a+f[k]*W[k],0);const caps=[];
  if(x.conf<40){s=Math.min(s,64);caps.push('ความมั่นใจราคาต่ำกว่า 40% → จำกัดคะแนนไว้ที่ 64')}
  if(x.tier==='listing'){s=Math.min(s,79);caps.push('มีแต่ราคาประกาศ ไม่มีราคาขายจริง → จำกัดที่ 79')}
  if(x.tier==='ai_only'){s=Math.min(s,64);caps.push('ไม่มีหลักฐานราคาจากตลาดจริง → จำกัดที่ 64')}
  if(x.soldN<3&&x.soldN>0){s-=8;caps.push('ข้อมูลขายจริงน้อยกว่า 3 จุด → หัก 8 คะแนน')}
  if(x.profit<=0){s=Math.min(s,35);caps.push('กำไรประมาณการติดลบ → จำกัดที่ 35')}
  return{score:Math.max(0,Math.round(s)),factors:f,caps,roi};},
 risk(x){const c=CAT[x.cat]||CAT.generic;let r=(100-c.liq)*.3+c.fake*.25+c.repair*.2+(100-x.conf)*.25;
  if(x.price>30000)r+=8;if(x.cond==='poor')r+=10;if(x.cond==='unknown')r+=6;
  return Math.max(0,Math.min(100,Math.round(r)));},
 decide(s,x){let d=s>=80?'BUY':s>=65?'NEGOTIATE':s>=50?'FIND_BUYER_FIRST':'PASS';const why=[];const c=CAT[x.cat]||CAT.generic;
  if(x.mid)why.push(`ราคาเจ้าของ ${money(x.price)} เทียบราคาตลาดกลาง ${money(x.mid)} = ${x.price<x.mid?'ต่ำกว่า '+pct((1-x.price/x.mid)*100,0):'สูงกว่าตลาด'}`);
  why.push(x.soldN>0?`อ้างอิงราคาขายจริง ${x.soldN} จุด${x.listN?' + ราคาประกาศ '+x.listN+' จุด':''} → ความมั่นใจ ${x.conf}%`:`⚠️ ไม่มีข้อมูลราคาขายจริง → ความมั่นใจเพียง ${x.conf}%`);
  why.push(`หมวด${c.th}: ความต้องการ ${c.liq}/100 · ขายเฉลี่ย ~${c.days} วัน`);
  why.push(`ต้นทุนรวม ${money(x.cost.total)} (ขนส่ง ${money(x.cost.transport)} · ค่าแรง ${money(x.cost.labor)}) → กำไร ${sgn(x.profit)} · ROI ${pct(x.roi)}`);
  why.push(`ความเสี่ยง ${x.risk}/100 · ${x.risk>60?'สูง ควรตรวจสอบละเอียด':x.risk>35?'ปานกลาง':'ต่ำ'}`);
  if(x.price>=30000&&c.liq<75&&d==='BUY'){d='FIND_BUYER_FIRST';why.push('🔵 ราคาสูงเกิน ฿30,000 + สภาพคล่องไม่สูง → บังคับหาผู้ซื้อก่อน')}
  if(x.risk>=70&&d==='BUY'){d='NEGOTIATE';why.push('⚠️ ความเสี่ยงสูง → ลดระดับเป็นควรต่อราคา')}
  if(x.roi<20&&d==='BUY'){d='NEGOTIATE';why.push('ROI ต่ำกว่า 20% → ควรต่อรองราคาเพิ่ม')}
  if(x.profit<=0){d='PASS';why.push('🔴 กำไรติดลบหลังหักต้นทุนทั้งหมด')}
  return{decision:d,why};}};

const Learn={
 history(){return Store.all().filter(d=>d.actualProfit!=null)},
 similar(brand,model){const h=this.history();
  return{exact:h.filter(d=>d.brand&&brand&&d.brand.toLowerCase().trim()===brand.toLowerCase().trim()
   &&d.model&&model&&d.model.toLowerCase().trim()===model.toLowerCase().trim())};},
 blendedPrice(aiMid,sim){if(!sim.exact.length)return{mid:aiMid,source:'ai',n:0};

function decayChart(d){const c=CAT[d.cat]||CAT.generic;const days=30;const pts=[];
 for(let i=0;i<=days;i+=3){const lost=Math.min(40,i*(c.decay/7));pts.push([i,d.target*(1-lost/100)]);}
 const maxV=d.target*1.05||1;const svgPts=pts.map(([x,v])=>`${x/days*380+10},${100-(v/maxV*90)}`).join(' ');
 const info=Learn.decayInfo(d);const curDay=info?Math.min(days,info.days):0;const curX=curDay/days*380+10;
 return`<svg viewBox="0 0 400 100" class="h-20 w-full"><line x1="10" y1="90" x2="390" y2="90" stroke="currentColor" class="text-slate-500/20"/>
 <polyline fill="none" stroke="#f59e0b" stroke-width="2.5" points="${svgPts}"/>
 <line x1="${curX}" y1="5" x2="${curX}" y2="90" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/></svg>
 <div class="mt-1 text-[11px] text-slate-500">มูลค่าที่ลดลงตามเวลา (ตกเฉลี่ย ${c.decay}%/สัปดาห์)</div>`;}
function toast(msg){const t=document.createElement('div');
 t.className='fixed left-1/2 top-4 z-[100] -translate-x-1/2 rounded-full bg-ink-900 px-4 py-2 text-xs font-medium text-white shadow-card';
 t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}

function resizeImg(file,max,q){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,max/Math.max(i.width,i.height));
 c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};i.src=e.target.result};r.readAsDataURL(file)});}

function photoCheck(dataUrl){return new Promise(res=>{const im=new Image();im.onload=()=>{const W=200,H=Math.max(1,Math.round(im.height*200/im.width));
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0,W,H);const p=x.getImageData(0,0,W,H).data;

 redraw(){if(cur==='/batch'){const el=document.getElementById('batchList');if(el){el.innerHTML=BatchRows();document.getElementById('batchSum').innerHTML=BatchSummary();}}},
 quick(it){const d=it.scan;if(!d)return null;const p=scanEvidence({...d});const E=Engine.evidence(p);const c=d.item&&d.item.condition||'good';
  const v=Engine.valuation(E,c);const dp=Math.min(50,(d.defects||[]).reduce((a,x)=>a+(+x.price_impact_pct||0),0));const f=1-dp/100;
  const mid=(v.mid||0)*f,maxBuy=(v.maxBuy||0)*f,target=(v.target||0)*f;const lvl=d.auth?d.auth.level:'suspicious';
  let light=lvl==='high_risk'?'red':!mid?'yellow':it.price?(it.price<=maxBuy?(lvl==='pass'?'green':'yellow'):'red'):(lvl==='pass'?'green':'yellow');
  if(d.item&&d.item.category==='luxury')light='red';
  return{mid,maxBuy,target,light,lvl,name:d.item.name,soldN:E.soldN};}};

let KBD=null,kbQ='';
async function loadKB(){if(KBD)return;try{const c=localStorage.getItem('deal_kb');if(c)KBD=JSON.parse(c);}catch(e){}
 if(!API.url()){if(cur==='/kb')render();return;}
 try{const r=await fetch(API.url()+'/api/kb',{headers:{'x-app-key':API.key()}});const d=await r.json();if(d.entries){KBD=d.entries;try{localStorage.setItem('deal_kb',JSON.stringify(KBD))}catch(e){}}}catch(e){}
 if(cur==='/kb')render();}

const KBKIND={trend:'กระแสตอนนี้',market:'ตลาดในไทย',rule:'กฎทั่วไป',tag:'ป้ายเสื้อแต่ละยี่ห้อ',genre:'ประเภทที่ตลาดต้องการ',brand:'แบรนด์'};
function KBList(){if(!KBD)return'<div class="py-6 text-center text-xs text-slate-500">กำลังโหลด... (ต้องตั้งค่าเซิร์ฟเวอร์ก่อน)</div>';
 const q=kbQ.trim().toLowerCase();const L=KBD.filter(e=>!q||[e.title,e.brand,e.era,...e.keywords,...e.cues,...e.red_flags].join(' ').toLowerCase().includes(q));
 if(!L.length)return'<div class="py-6 text-center text-xs text-slate-500">ไม่พบ</div>';
 const cats=[['apparel.vintage','👕 เสื้อยืด/เสื้อวงวินเทจ'],['apparel.football','⚽ เสื้อฟุตบอล'],['apparel.denim','👖 ยีนส์/แจ็คเก็ต/เสื้อผ้าวินเทจ']];
 return cats.map(([c,lab])=>{const G=L.filter(e=>e.category===c);if(!G.length)return'';
  return`<div class="text-sm font-extrabold">${lab}</div>`+['trend','market','rule','genre','brand','tag'].map(k=>{const X=G.filter(e=>e.kind===k);if(!X.length)return'';
   return`<div class="mt-2 text-[11px] font-semibold uppercase tracking-wide text-slate-500">${KBKIND[k]}</div>`+X.map(e=>`<details class="rounded-2xl glass p-3 text-[12px]"><summary class="cursor-pointer font-bold">${e.title}${e.era?` <span class="font-normal text-slate-500">· ${e.era}</span>`:''}</summary>
   <div class="mt-2 space-y-0.5">${e.cues.map(c=>`<div>• ${c}</div>`).join('')}</div>
   ${e.red_flags.length?`<div class="mt-1.5 text-rose-500">${e.red_flags.map(r=>'⚠ '+r).join('<br>')}</div>`:''}
   ${e.value_notes?`<div class="mt-1.5 text-emerald-600">💰 ${e.value_notes}</div>`:''}
   <div class="mt-1.5 text-[10px] text-slate-400">${e.confidence==='general'?'ความรู้ทั่วไป ยังไม่ได้ยืนยันจากแหล่งอ้างอิง':''}${(e.sources||[]).map((u,i)=>` <a href="${u}" target="_blank" rel="noopener" class="text-sky-600 underline">แหล่ง ${i+1}</a>`).join('')}</div></details>`).join('<div class="h-1.5"></div>')}).join('')}).join('<div class="h-4"></div>');}

/* ============ ซิงก์ดีลกับฐานข้อมูลกลาง (Supabase) ============ */
const Sync={st:null,timer:null,busy:false,
 s(){if(!this.st){try{this.st=JSON.parse(localStorage.getItem('deal_sync'))||{}}catch(e){this.st={}}this.st.dirty=this.st.dirty||[];}return this.st;},
 keep(){try{localStorage.setItem('deal_sync',JSON.stringify(this.st))}catch(e){}},
 mark(id){const s=this.s();if(!s.dirty.includes(id))s.dirty.push(id);this.keep();clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),1500);},
 ok(){return API.url()&&API.key()&&navigator.onLine;},
 async call(path,opt){const r=await fetch(API.url()+path,{...(opt||{}),headers:{'content-type':'application/json','x-app-key':API.key()}});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||r.status);return d;},
 async push(){if(!this.ok()||this.busy)return;const s=this.s();if(!s.dirty.length)return;this.busy=true;
  try{const ids=[...s.dirty];const deals=ids.map(id=>Store.get(id)).filter(d=>d&&!d.demo).map(d=>{const {img,...rest}=d;return{id:d.id,data:rest,updated_at:new Date(d.updatedAt||Date.now()).toISOString()}});
   if(deals.length)await this.call('/api/deals',{method:'POST',body:JSON.stringify({deals})});
   s.dirty=s.dirty.filter(id=>!ids.includes(id));this.keep();setSyncBadge('ok');}
  catch(e){console.warn('sync push',e);setSyncBadge('err');}finally{this.busy=false;}},
 async pull(){if(!this.ok())return;const s=this.s();
  try{const d=await this.call('/api/deals'+(s.lastPull?'?since='+encodeURIComponent(s.lastPull):''));let changed=0;
   if(d.deals.length&&Store.d.deals.some(x=>x.demo)){Store.d.deals=Store.d.deals.filter(x=>!x.demo);changed++;}
   for(const row of d.deals){const loc=Store.get(row.id);const t=Date.parse(row.updated_at);
    if(row.deleted){if(loc){Store.d.deals=Store.d.deals.filter(x=>x.id!==row.id);changed++;}continue;}
    if(!loc){Store.d.deals.push({...row.data,updatedAt:t});changed++;}
    else if((loc.updatedAt||0)<t&&!s.dirty.includes(row.id)){Object.assign(loc,row.data,{img:loc.img,updatedAt:t});changed++;}}
   s.lastPull=d.now;this.keep();
   if(changed){Store.d.deals.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));localStorage.setItem(Store.k,JSON.stringify(Store.d));render();}
   setSyncBadge('ok');}catch(e){console.warn('sync pull',e);setSyncBadge('err');}},
 /* ครั้งแรก: ส่งดีลที่มีอยู่ในเครื่องขึ้นทั้งหมด */
 first(){const s=this.s();if(s.initialized)return;Store.all().filter(d=>!d.demo).forEach(d=>{if(!s.dirty.includes(d.id))s.dirty.push(d.id)});s.initialized=true;this.keep();},
 async start(){if(!API.url()||!API.key())return;this.first();await this.push();await this.pull();
  setInterval(()=>{if(document.visibilityState==='visible'){this.push();this.pull();}},60000);
  window.addEventListener('online',()=>{this.push();this.pull();});}};
function setSyncBadge(st){const el=document.getElementById('syncBadge');if(el){el.textContent=st==='ok'?'☁︎ ซิงก์แล้ว':'☁︎ ยังไม่ซิงก์';el.className='text-[10px] '+(st==='ok'?'text-emerald-500':'text-amber-500');}}
async function uploadDealImages(id,imgsArr,labelsArr){if(!API.url()||!API.key()||!imgsArr||!imgsArr.length)return;
 try{await Sync.call('/api/deals/images',{method:'POST',body:JSON.stringify({id,images:imgsArr,labels:labelsArr})});}catch(e){console.warn('img upload',e);}}
